    disabled: false
    visible: true
    width: 200
    type: number_input
    helper: '[m] grid resolution of the natura data.'
  window_size:
    disabled: false
    visible: true
    width: 200
    type: number_input
    helper: '[bytes] size of the shifting rasterization window. the required ram scales
      with window_size^2.'
